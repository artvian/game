<!DOCTYPE html>
<html>
<head>
    <title>Flappy Bird Pro</title>
    <style>
        body { margin: 0; background: #70c5ce; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Arial', sans-serif; }
        canvas { background: #4ec0ca; border-bottom: 5px solid #5ee270; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <h2 id="scoreBoard">Score: 0</h2>
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let bird = { x: 50, y: 300, w: 34, h: 24, vel: 0, gravity: 0.25, jump: -5 };
        let pipes = [];
        let score = 0;
        let gameActive = true;

        function createPipe() {
            let gap = 150;
            let minPipeHeight = 50;
            let pipeHeight = Math.floor(Math.random() * (canvas.height - gap - 2 * minPipeHeight)) + minPipeHeight;
            pipes.push({ x: canvas.width, y: pipeHeight });
        }

        function draw() {
            if (!gameActive) return;

            // Latar belakang
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gerakan Burung
            bird.vel += bird.gravity;
            bird.y += bird.vel;

            // Gambar Burung (Kuning)
            ctx.fillStyle = "#FFD700";
            ctx.beginPath();
            ctx.arc(bird.x + 17, bird.y + 12, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "orange"; // Paruh
            ctx.fillRect(bird.x + 20, bird.y + 10, 10, 5);

            // Pipa
            pipes.forEach((p, index) => {
                p.x -= 2;
                
                // Gambar Pipa Hijau (Atas)
                ctx.fillStyle = "#2e8b57";
                ctx.fillRect(p.x, 0, 50, p.y);
                ctx.fillStyle = "#228b22";
                ctx.fillRect(p.x - 5, p.y - 20, 60, 20); // Bibir pipa atas

                // Gambar Pipa Hijau (Bawah)
                ctx.fillStyle = "#2e8b57";
                ctx.fillRect(p.x, p.y + 150, 50, canvas.height - (p.y + 150));
                ctx.fillStyle = "#228b22";
                ctx.fillRect(p.x - 5, p.y + 150, 60, 20); // Bibir pipa bawah

                // Cek Tabrakan
                if (bird.x + bird.w > p.x && bird.x < p.x + 50 && (bird.y < p.y || bird.y + bird.h > p.y + 150)) {
                    gameOver();
                }

                if (p.x === 50) score++;
            });

            if (pipes.length > 0 && pipes[0].x < -50) pipes.shift();
            if (bird.y > canvas.height || bird.y < 0) gameOver();

            document.getElementById("scoreBoard").innerText = "Score: " + score;
            requestAnimationFrame(draw);
        }

        function gameOver() {
            gameActive = false;
            alert("Game Over! Score Anda: " + score);
            location.reload();
        }

        setInterval(createPipe, 2000);
        window.onkeydown = () => bird.vel = bird.jump;
        draw();
    </script>
</body>
</html>
